name: Build Android APK & Native JNI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-apk:
    name: Build Android APK (Kotlin + Rust JNI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Configure Android SDK 35 & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-35" ]; then
              "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
            fi
          fi
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved SDK=$SDK_ROOT NDK=$NDK_DIR"
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/ndk"

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test portable Rust core library
        run: cargo test --no-default-features --lib

      - name: Check JNI crate
        run: cargo check --manifest-path rust/lightraw_jni/Cargo.toml

      - name: Build liblightraw_jni.so for Android ABIs
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "y" | sdkmanager --install "ndk;27.2.12479018"
            ANDROID_NDK_HOME="$SDK_ROOT/ndk/27.2.12479018"
            export ANDROID_NDK_HOME
          fi
          echo "Using ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          mkdir -p android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -p 26 \
            -o android/app/src/main/jniLibs \
            build --release --manifest-path rust/lightraw_jni/Cargo.toml

      - name: Run Android lint, unit tests and build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Stage APK outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LightRaw-Android-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/LightRaw-Android-release.apk
          ls -lh dist/*.apk

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightRaw-Android-APKs
          path: |
            dist/LightRaw-Android-debug.apk
            dist/LightRaw-Android-release.apk
