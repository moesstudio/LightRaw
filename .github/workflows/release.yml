name: Build & Release Multi-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================================
  # 1. macOS Build & DMG Installer
  # ==========================================================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Resolve release version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "LIGHTRAW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LIGHTRAW_VERSION=1.2.0" >> "$GITHUB_ENV"
          fi

      - name: Package LightRaw.app
        run: |
          mkdir -p LightRaw.app/Contents/MacOS
          mkdir -p LightRaw.app/Contents/Resources
          cp target/release/lightraw LightRaw.app/Contents/MacOS/LightRaw
          chmod +x LightRaw.app/Contents/MacOS/LightRaw
          cp LightRaw.icns LightRaw.app/Contents/Resources/LightRaw.icns || true
          if [ -f LightRaw.app/Contents/Info.plist ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${LIGHTRAW_VERSION}" LightRaw.app/Contents/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${LIGHTRAW_VERSION}" LightRaw.app/Contents/Info.plist || true
          fi

      - name: Build macOS DMG Installer
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg

  # ==========================================================================
  # 2. Windows Build (.exe & .msi Installers)
  # ==========================================================================
  build-windows:
    name: Build Windows Installers (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup & WiX Toolset
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix || true

      - name: Build Windows Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Prepare Windows Dist Directory and Bundled Runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path packaging/windows/redist
          Copy-Item target/x86_64-pc-windows-msvc/release/lightraw.exe target/release/lightraw.exe -Force
          # Bundle VCRUNTIME and MSVCP DLLs from runner System32 as portable safety net
          $dlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll")
          foreach ($dll in $dlls) {
            $sysPath = "C:\Windows\System32\$dll"
            if (Test-Path $sysPath) {
              Copy-Item $sysPath "packaging/windows/redist\$dll" -Force
              Write-Host "Bundled $dll into packaging/windows/redist/"
            }
          }

      - name: Resolve release version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -and $ref.StartsWith("v")) { $ver = $ref.Substring(1) } else { $ver = "1.2.0" }
          "LIGHTRAW_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:LIGHTRAW_VERSION" packaging/windows/LightRaw.iss

      - name: Build WiX Installer (.msi)
        shell: pwsh
        run: |
          wix extension add WixToolset.UI.wixext || true
          $wxs = Get-Content packaging/windows/LightRaw.wxs -Raw
          $wxs = $wxs -replace '1\.2\.0\.0', "$($env:LIGHTRAW_VERSION).0" -replace 'LightRaw 1\.2\.0', "LightRaw $($env:LIGHTRAW_VERSION)"
          Set-Content -Path packaging/windows/LightRaw.wxs -Value $wxs -Encoding UTF8
          wix build -arch x64 packaging/windows/LightRaw.wxs -o "dist/LightRaw-$($env:LIGHTRAW_VERSION).msi" || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn

  # ==========================================================================
  # 3. Linux Build (.deb, .AppImage, tar.gz)
  # ==========================================================================
  build-linux:
    name: Build Linux Installers (.deb, .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libgl1-mesa-dev desktop-file-utils libfuse2 || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux Release Binary
        run: cargo build --release

      - name: Resolve release version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "LIGHTRAW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LIGHTRAW_VERSION=1.2.0" >> "$GITHUB_ENV"
          fi

      - name: Build Debian Package (.deb)
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Build AppImage / Linux Tarball
        run: |
          # Download linuxdeploy & appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool || true
          chmod +x /usr/local/bin/appimagetool || true
          export APPIMAGE_EXTRACT_AND_RUN=1
          chmod +x packaging/linux/build_appimage.sh
          ./packaging/linux/build_appimage.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: warn

  # ==========================================================================
  # 4. Android Build (.apk + Native Rust JNI)
  # ==========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Configure Android SDK 35 & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-35" ]; then
              "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
            fi
          fi
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved SDK=$SDK_ROOT NDK=$NDK_DIR"
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/ndk"

      - name: Install Rust Toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build liblightraw_jni.so
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)}"
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "y" | sdkmanager --install "ndk;27.2.12479018"
            ANDROID_NDK_HOME="$SDK_ROOT/ndk/27.2.12479018"
          fi
          export ANDROID_NDK_HOME
          echo "Using ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          mkdir -p android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -P 26 \
            -o android/app/src/main/jniLibs \
            --manifest-path rust/lightraw_jni/Cargo.toml \
            build --release

      - name: Restore cached Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lightraw-android-debug-keystore-v1

      - name: Configure Android signing & version
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "LIGHTRAW_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LIGHTRAW_VERSION_NAME=1.2.0" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "${GITHUB_WORKSPACE}/android/lightraw-release.jks"
            echo "LIGHTRAW_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/lightraw-release.jks" >> "$GITHUB_ENV"
            echo "LIGHTRAW_KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "LIGHTRAW_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "LIGHTRAW_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
            echo "Configured persistent release keystore from GitHub Secrets."
          else
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "Using persistent cached Android debug keystore."
          fi

      - name: Build & Test Android APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Stage Android APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/LightRaw-Android-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LightRaw-Android-debug.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/LightRaw-Android-release.apk
            dist/LightRaw-Android-debug.apk

  # ==========================================================================
  # 5. Publish Release to GitHub
  # ==========================================================================
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release_assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release_assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets

      - name: Resolve release version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "LIGHTRAW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "LIGHTRAW_VERSION=1.2.0" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release_assets/*
          name: "LightRaw ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## LightRaw ${{ github.ref_name }} — Official Release

            Professional 32-bit Linear RAW Photo Editor & Catalog by Moestret for Desktop & Android.

            ### Available Installers & APKs:
            - **Android**: `LightRaw-Android-release.apk` & `LightRaw-Android-debug.apk`
            - **macOS**: `LightRaw-${{ env.LIGHTRAW_VERSION }}-macOS.dmg` (Universal Drag & Drop Installer)
            - **Windows**: `LightRaw-${{ env.LIGHTRAW_VERSION }}-Windows-Setup.exe` (Inno Setup) & `LightRaw-${{ env.LIGHTRAW_VERSION }}.msi` (Windows Installer)
            - **Linux (Debian / Ubuntu / Mint)**: `lightraw_${{ env.LIGHTRAW_VERSION }}_amd64.deb`
            - **Linux (Universal)**: `LightRaw-${{ env.LIGHTRAW_VERSION }}-x86_64.AppImage` & `lightraw-${{ env.LIGHTRAW_VERSION }}-linux-x86_64.tar.gz`

            ### Key Features & Improvements:
            - **Real-Time Interactive Slider Editing**: Smooth real-time preview while dragging Exposure and Develop sliders on both Desktop (`1024px` draft + zero-lag zoom cache) and Android (conflated single-worker `540px` bilinear preview + automatic full-res settle)
            - **Built-In Auto-Update**: In-app GitHub Releases updater on both Desktop and Android so you can upgrade in place without uninstalling or losing your catalog, photos, and presets
            - **Camera RAW Develop Pipeline**: 11-stage ACR PV2012 non-destructive float pipeline
            - **Android Camera2 Pro RAW + AI Match**: DNG+JPEG pro capture, AI Auto Tone / Match Ref, `.xmp` presets, Text & Graphic watermarks
            - **120 FPS Desktop Performance**: Instant GPU-accelerated pan/zoom with zero stutter
            - **Cropping Synchronization**: Sync crop framing, aspect ratio, and angle across photos or whole library
            - **Print & Publishing Module**: Contact Sheet, Picture Package, Custom Package, 300 PPI export
            - **Native macOS & Cross-Platform UI**: Squircle macOS/Android icon, full keyboard shortcuts, and `.lrcat` catalog
