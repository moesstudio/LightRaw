[package]
name = "lightraw"
version = "1.0.0"
edition = "2021"
authors = ["Moestret"]
description = "LightRaw 1.0.0 - Professional RAW Photo Editor & Catalog by Moestret"

[lib]
name = "lightraw"
path = "src/lib.rs"

[[bin]]
name = "lightraw"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:open"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"], optional = true }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", features = ["all_loaders"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "hdr", "webp"] }
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rfd = { version = "0.15", optional = true }
open = { version = "5.3", optional = true }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
